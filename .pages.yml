# Admin panel configuration for Pages CMS (https://app.pagescms.org)
media:
  input: images
  output: /images

content:
  - name: arrange
    label: Arrange projects
    type: file
    path: content/arrange.json
    format: json
    fields:
      - name: work
        label: Work page (home). Drag to reorder; top = first
        type: object
        list: true
        fields:
          - name: project
            label: Project
            type: reference
            options:
              collection: projects
              search: title
              value: "{path}"
              label: "{title}"
      - name: archive
        label: Archive page. Drag to reorder; top = first
        type: object
        list: true
        fields:
          - name: project
            label: Project
            type: reference
            options:
              collection: projects
              search: title
              value: "{path}"
              label: "{title}"
      - name: hidden
        label: Hidden (not shown on any page). Drag to reorder
        type: object
        list: true
        fields:
          - name: project
            label: Project
            type: reference
            options:
              collection: projects
              search: title
              value: "{path}"
              label: "{title}"

  - name: projects
    label: Projects
    type: collection
    path: content/projects
    format: json
    filename: "{primary}.json"
    view:
      fields: [title]
      primary: title
      sort: [title]
      search: [title]
    fields:
      - name: title
        label: Project name
        type: string
        required: true
      - name: categories
        label: Categories
        type: reference
        options:
          collection: categories
          multiple: true
          search: name
          value: "{path}"
          label: "{name}"
      - name: frames
        label: Row images — upload 3 (left to right). Any size, HD or 4K; the site shrinks them automatically
        type: image
        options:
          multiple:
            max: 3
          extensions: [jpg, jpeg, png, webp]
          rename: true
      - name: videos
        label: Films (first one shows at the top; add more for extra films)
        type: object
        list: true
        fields:
          - name: title
            label: Film name (shown under the film, e.g. "30 sec — Bumper")
            type: string
          - name: url
            label: Vimeo link
            type: string
      - name: client
        label: Client
        type: string
      - name: agency
        label: Agency
        type: string
      - name: production_house
        label: Production House
        type: string
      - name: director
        label: Director
        type: string
      - name: dop
        label: Director of Photography
        type: string
      - name: executive_producer
        label: Executive Producer
        type: string
      - name: producer
        label: Producer
        type: string
      - name: editor
        label: Editor
        type: string
      - name: colourist
        label: Colourist
        type: string
      - name: more_credits
        label: Additional credits (optional)
        type: object
        list: true
        fields:
          - name: role
            label: Role
            type: string
          - name: name
            label: Name
            type: string
      - name: stills
        label: Stills — add as many as you like (shown two per row, shrunk automatically)
        type: image
        options:
          multiple: true
          extensions: [jpg, jpeg, png, webp]
          rename: true

  - name: categories
    label: Categories
    type: collection
    path: content/categories
    format: json
    filename: "{primary}.json"
    view:
      fields: [name, order]
      primary: name
      sort: [order, name]
      default:
        sort: order
        order: asc
    fields:
      - name: name
        label: Category name
        type: string
        required: true
      - name: order
        label: Button position (1 = first)
        type: number

  - name: about
    label: About page
    type: file
    path: content/about.json
    format: json
    fields:
      - name: intro
        label: Opening line
        type: text
      - name: body
        label: Bio (leave a blank line between paragraphs)
        type: text
      - name: portrait
        label: Portrait photo
        type: image
      - name: profile_url
        label: Profile PDF link (e.g. Google Drive)
        type: string

  - name: feature-film
    label: Feature Film page
    type: file
    path: content/feature-film.json
    format: json
    fields:
      - name: title
        label: Film title
        type: string
      - name: details
        label: Detail lines
        type: string
        list: true
      - name: role
        label: Your credit line
        type: string
      - name: trailer
        label: Trailer link (Vimeo or YouTube)
        type: string
      - name: teaser
        label: Teaser link (Vimeo or YouTube)
        type: string
      - name: stills
        label: Frame grabs
        type: image
        options:
          multiple: true
      - name: credits
        label: Credits
        type: object
        list: true
        fields:
          - name: role
            type: string
          - name: name
            type: string

  - name: settings
    label: Site settings
    type: file
    path: content/settings.json
    format: json
    fields:
      - name: name
        label: Name (top left)
        type: string
      - name: headline
        label: Home page title
        type: string
      - name: thumbnail_style
        label: Work page thumbnails
        type: select
        default: three
        options:
          values:
            - name: three
              label: Three images per project
            - name: one
              label: One image per project (three projects side by side)
      - name: email
        label: Email
        type: string
      - name: website
        label: Website
        type: string
      - name: instagram
        label: Instagram link
        type: string
      - name: vimeo
        label: Vimeo link
        type: string
      - name: contact_intro
        label: Contact page intro
        type: text
      - name: location
        label: Location line
        type: string
      - name: web3forms_key
        label: Contact form key (from web3forms.com)
        type: string
      - name: seo_description
        label: Google description
        type: text
